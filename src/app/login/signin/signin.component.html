 

   <div class="container-fluide d-flex justify-content-center align-items-center min-vh-100">
    <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-4">
      <div class="card p-4 shadow rounded">
        <h2 class="text-center mb-4">Login</h2>
        <form (submit)="login()">
          <div class="mb-3">
            <label for="username" class="form-label">Email:</label>
            <input 
              class="form-control" 
              type="text" 
              id="username" 
              [(ngModel)]="credentials.username" 
              name="username" 
              placeholder="Enter email here" 
              required />
          </div>
  
          <div class="mb-3">
            <label for="password" class="form-label">Password:</label>
            <input 
              class="form-control" 
              type="password" 
              id="password" 
              [(ngModel)]="credentials.password" 
              name="password" 
              placeholder="Enter password here" 
              required />
          </div>
  
          <div class="d-grid mb-3">
            <button class="btn btn-primary" type="submit">Login</button>
          </div>

           <div class="text-center pb-2">
               <a style="text-decoration: none;" routerLink="/forget-password">Forgot Password</a>
           </div>
           
            <div class="text-center">
               <span>Don't have an account? </span><a routerLink="/signup" style="text-decoration: none;">Register</a>
           </div>
  
          <p *ngIf="errorMessage" class="text-danger mt-3 text-center">{{ errorMessage }}</p>
        </form>
      </div>
    </div>
  </div>
