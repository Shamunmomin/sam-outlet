<div class="container mt-5 p-5">
			<div class="row">
				<div class="col-md-6 p-5">
					<img alt=""  width="100%" height="400px">
				</div>
				<div class="col-md-6 mt-3 p-5">
					<div class="card shadow p-3 mb-5 bg-body-tertiary rounded">
						<div class="card-header">
							<p class="fs-4 text-center">Forgot Password</p>
							<div *ngIf="succMsg" class="text-center alert alert-success mt-3">
								{{succMsg}}
							</div>
							<div *ngIf="errorMsg" class="text-center alert alert-danger mt-3">
								{{errorMsg}}
							</div>
						</div>
						<div class="card-body">
							<form>
								<div class="mb-3">
									<label class="form-label">Email :</label>
                                     <input	class="form-control" [(ngModel)]="email" name="email" type="email" placeholder="Enter your email ">
								</div>
								<div class="text-center">
									<button (click)="passwordForgot()" type="submit" class="btn bg-primary text-white">Send</button>
								</div>
							</form>
						</div>
					</div>
				</div>
			</div>
		</div>
