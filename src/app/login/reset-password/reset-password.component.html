<div class="container mt-5 p-5">
  <div class="row">
    <div class="col-md-6 p-5">
      <img alt="" src="" width="100%" height="400px">
    </div>
    <div class="col-md-6 mt-3 p-5">
      <div class="card shadow p-3 mb-5 bg-body-tertiary rounded">
        <div class="card-header">
          <p class="fs-4 text-center">Reset Password</p>
          <div *ngIf="errorMsg" class="text-center alert alert-danger mt-3">
            {{ errorMsg }}
          </div>
        </div>
        <div class="card-body">
          <form (ngSubmit)="resetPassword()">
            <div class="mb-3">
              <label class="form-label">New Password</label>
              <input class="form-control" [(ngModel)]="password" name="password" type="password">
            </div>

            <div class="mb-3">
              <label class="form-label">Confirm Password</label>
              <input class="form-control" [(ngModel)]="confirmPassword" name="confirmPassword" type="password">
            </div>

            <button type="submit" class="btn bg-primary text-white col-md-12">
              Reset Password
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
