 <app-header></app-header>

 <!-- heros section strat -->

 <section class="hero d-flex align-items-center text-center text-lg-start mt-5">
  <div class="container">
    
    <!-- Row 1: Slide in from left -->
    <div class="row slide-in-left animate-on-load">
      <div class="col-lg-12">
        <h3 class="text-danger">Fashion Sale</h3>
        <h1 class="fw-bold">Minimal Menz Style</h1>
        <p class="text-muted">Smart Shopping Trusted By Millions</p>
        <a href="#" class="btn btn-dark">Shop Now</a>
      </div>
    </div>

    <!-- Row 2: Slide in from right -->
    <div class="row slide-in-right animate-on-load mt-4">
      <div class="col-lg-12 text-center">
        <div id="carouselExampleAutoplaying" class="carousel slide" data-bs-ride="carousel">
          <div class="carousel-inner">
            <div class="carousel-item active">
              <img [src]="image1" class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item">
              <img [src]="image2" class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item">
              <img [src]="image3" class="d-block w-100" alt="...">
            </div>
          </div>
          <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
          </button>
        </div>
      </div>
    </div>

  </div>
</section>

  
<!-- heros section end -->

 <!-- category section -->
  
 <!-- <h2 class="text-center mt-4 font-monospace">Category</h2> -->
<div class="category-container position-relative mt-3">
   <!-- Left Button -->
   <button class="btn btn-warning position-absolute top-50 start-0 translate-middle-y" 
   (click)="scrollLeft()"
   style="z-index: 1;">
‹
</button>

  <div class="category-slider d-flex overflow-auto" #sliderContainer style="scroll-behavior: smooth;">
    <div class="category-item" *ngFor="let category of categories">
      <div class="product-card">
       <a (click)="sendCategoryName(category.name);">
         <img 
          [src]="'https://sam-outlet-backend.onrender.com/uploads/' + category.filePath" 
          class="card-img-top img-fluid" 
          style="height: 150px; width: 100%; object-fit: contain; padding: 10px; border-radius: 10px;">
        <p class="text-center">{{ category.name }}</p>
       </a>
      </div>
    </div>
  </div>

  <!-- Right Button -->
  <button class="btn btn-warning position-absolute top-50 end-0 translate-middle-y" 
          (click)="scrollRight()"
          style="z-index: 1;">
    ›
  </button>

</div>

   <!-- category section -->
 
   <!-- product section -->
   <!-- <h2 class="mt-4 font-monospace">Product</h2> -->
  
    <div class="product-grid mt-5">
      <div class="product-card" *ngFor="let product of products">
        <!-- <a [routerLink]="['user/productDetail',product.id]">  -->
          <a (click)="onSubmit(product.id)">
        <img [src]="'https://sam-outlet-backend.onrender.com/uploads/'+product.imagePath" [alt]="product.name">
        <p class="">{{ product.name }}</p>
        <div class="info">
          <!-- <p class="mt-2">{{product.description | slice:0:40}}</p> -->
        <span class="fw-bold"> <h4>₹{{ product.discountPrice }}</h4> </span>
        <del class="text-muted ms-2">M.R.P: ₹{{product.price}}</del>
        <span class="text-success ms-2">({{product.discount}}% off)</span>
        <p class="text-primary">FREE delivery Sat, 3 May<br>
          <small>Or fastest delivery Tomorrow, 1 May</small>
        </div>
            <button class="btn btn-warning btn-sm">
            <i class="fa fa-shopping-cart me-1"></i> View Details
          </button>
        </a>
      </div>
    </div>
  
   <!-- product section -->
  
   <app-mobile-end-icons></app-mobile-end-icons>

 <app-footer></app-footer>
