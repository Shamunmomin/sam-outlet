<app-header></app-header>
<div class="container">
<table class="table table-striped">
    <thead>
      <tr>
        <th>Sr.</th>
        <th>Image</th>
        <th>Product Name</th>
        <th>Discounted Price</th>
        <th class="text-center">Quantity</th>
        <th>Total Price</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of cartItems; index as i">
        <td>{{i+1}}</td>
        <td><img [src]="'https://sam-outlet-backend.onrender.com/'+item.product.imagePath" alt="Product Image" width="50"></td>
        <td>{{ item.product.name }}</td>
        <td>{{ item.product.discountPrice }}</td>
       
        <td class="text-center">
                 <a class="btn-primary" (click)="updateCartQuantity('de', item.cid)"> 
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-dash" viewBox="0 0 16 16">
                      <path d="M4 8a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7A.5.5 0 0 1 4 8"/>
                  </svg>
                 </a>
           <span> [ {{ item.quantity }} ] </span>

                 <a class="btn-primary" (click)="updateCartQuantity('in', item.cid)">
                 <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-plus-lg" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2"/>
                 </svg>
                </a>
       </td>

        <td>{{ (item.totalPrice)  }}</td>
      </tr>
      <tr>
        <td colspan="4"></td>
        <td class="fw-bold">Total Price</td>
        <td class="fw-bold"><h5> &#8377; {{ totalOrderPrice }}</h5></td>
      </tr>
    </tbody>
  </table>
  <div class="text-center">
						<button (click)="proccedPayment()"  [disabled]="isCartEmpty" class="btn btn-warning"> Proceed Payment</button>
					</div>
</div>
  <app-footer></app-footer>
