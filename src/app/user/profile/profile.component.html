<app-header></app-header>
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6 col-xl-5">
      <div class="card shadow-sm">
        <div *ngIf="successmsg" class=" text-center alert alert-success mt-3">
        {{ successmsg }}
        </div>
         <div *ngIf="errorMsg" class=" text-center alert alert-danger mt-3">
        {{ errorMsg }}
         </div>
          <div class="card-body text-center">
          <h4 class="card-title">{{ user.name }}</h4>
          <p class="card-text text-muted">{{ user.email }}</p>
          <!-- <p class="card-text"><i class="bi bi-telephone-fill me-2"></i>{{ user.phone }}</p>
          <p class="card-text"><i class="bi bi-geo-alt-fill me-2"></i>{{ user.address }}</p> -->
          <button class="btn btn-primary w-100 mt-3" (click)="editProfile()">Edit Profile</button>
          <button class="btn btn-secondary w-100 mt-2" (click)="openPasswordModal()">Change Password</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Profile Edit Modal -->
<div class="modal fade" tabindex="-1" [ngClass]="{'show d-block': isModalOpen}" [attr.aria-hidden]="!isModalOpen" [attr.style]="isModalOpen ? 'display: block;' : 'display: none;'">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Edit Profile</h5>
        <button type="button" class="btn-close" aria-label="Close" (click)="closeModal()"></button>
      </div>
      <div class="modal-body">
        <form #profileForm="ngForm" (ngSubmit)="saveProfile(profileForm)">
          <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" [(ngModel)]="user.name" name="name" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" [(ngModel)]="user.email" name="email" required>
          </div>
          <!-- <div class="mb-3">
            <label class="form-label">Phone</label>
            <input type="text" class="form-control" [(ngModel)]="user.phone" name="phone" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Address</label>
            <input type="text" class="form-control" [(ngModel)]="user.address" name="address" required>
          </div> -->
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" (click)="closeModal()">Close</button>
            <button type="submit" class="btn btn-primary">Save changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Password Change Modal -->
<div class="modal fade" tabindex="-1" [ngClass]="{'show d-block': isPasswordModalOpen}" [attr.aria-hidden]="!isPasswordModalOpen" [attr.style]="isPasswordModalOpen ? 'display: block;' : 'display: none;'">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Change Password</h5>
        <button type="button" class="btn-close" aria-label="Close" (click)="closeModal()"></button>
      </div>
      <div *ngIf="errorMsg" class=" text-center alert alert-danger mt-3">
        {{ errorMsg }}
         </div>
      <div class="modal-body">
        <form #passwordForm="ngForm" (ngSubmit)="changePassword(passwordForm)">
          <div class="mb-3">
            <label class="form-label">Current Password</label>
            <input type="password" class="form-control" [(ngModel)]="passwordData.currentPassword" name="currentPassword" required>
          </div>
          <div class="mb-3">
            <label class="form-label">New Password</label>
            <input type="password" class="form-control" [(ngModel)]="passwordData.newPassword" name="newPassword" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Confirm New Password</label>
            <input type="password" class="form-control" [(ngModel)]="passwordData.confirmPassword" name="confirmPassword" required>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" (click)="closeModal()">Close</button>
            <button type="submit" class="btn btn-success">Change Password</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
<app-mobile-end-icons></app-mobile-end-icons>
<app-footer></app-footer>
